<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harsh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-bleed canvas world; HUD pinned top-left, message log top-center, action rail pinned bottom. One committed night-steppe look. */
:root {
  --ink: #0b0d16;
  --panel: rgba(11, 13, 22, .88);
  --ash: #e9e1cf;
  --dim: #9a937f;
  --ember: #f2a03d;
  --blood: #c4453a;
  --frost: #a9d4e8;
  --display: "Spectral SC", Georgia, "Times New Roman", serif;
  --ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--ash); font-family: var(--ui); overflow: hidden; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

#hud {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 0;
  padding: 10px 16px; display: grid; gap: 6px; font-size: 13px;
  pointer-events: none; text-shadow: 0 1px 2px #000; max-width: 15rem;
  background: linear-gradient(90deg, rgba(5,6,12,.55), rgba(5,6,12,.3)); border-radius: 0 0 4px 0;
}
#hud .row { display: flex; align-items: center; gap: 8px; }
#dayLbl { font-family: var(--display); font-size: 20px; letter-spacing: .04em; color: var(--ember); }
#sunTxt { color: var(--dim); font-variant-numeric: tabular-nums; }
.bar { position: relative; flex: 1; height: 7px; min-width: 7rem; background: rgba(255,255,255,.12); border-radius: 1px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 100%; }
#sunFill { background: #e8c46a; }
#hpFill { background: var(--blood); }
#foodFill { background: #b58a4a; }
.lbl { width: 3.6rem; color: #c9c1ab; text-transform: uppercase; font-size: 10px; letter-spacing: .1em; }
.inv { display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.inv b { color: var(--ash); }
#frostRow b { color: var(--frost); font-variant-numeric: tabular-nums; }
#frostRow.near b { color: #fff; }

#log {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%);
  width: min(26rem, calc(100% - 32px)); display: grid; gap: 4px; justify-items: center;
  pointer-events: none; text-align: center;
}
#log div {
  font-size: 14px; padding: 4px 10px; background: rgba(5,6,12,.55); border-radius: 2px;
  animation: fade 6s forwards; text-shadow: 0 1px 2px #000;
}
@keyframes fade { 0% { opacity: 0; transform: translateY(-4px); } 6% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

#rail {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: none;
}
#rail button {
  pointer-events: auto; font: 600 12px var(--ui); color: var(--ash);
  background: rgba(10, 11, 20, .72); border: 1px solid rgba(233,225,207,.18);
  padding: 6px 10px; border-radius: 3px; cursor: pointer; display: flex; gap: 6px; align-items: center;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#rail button:hover { border-color: rgba(242,160,61,.6); }
#rail button.on { background: rgba(242,160,61,.25); }
#rail button:focus-visible, #panel button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
kbd { font: 700 10px var(--ui); color: var(--ember); border: 1px solid rgba(242,160,61,.45); border-radius: 2px; padding: 0 4px; }

#panel {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(ellipse at center, rgba(5,6,12,.35), rgba(5,6,12,.8));
}
#panel .card {
  width: min(30rem, 100%); max-height: calc(100% - 8px); overflow: auto;
  background: var(--panel); border: 1px solid rgba(242,160,61,.3); padding: 22px 24px; box-sizing: border-box;
}
#panel h1 { font: 700 clamp(34px, 7vw, 52px)/1 var(--display); color: var(--ember); margin: 0 0 10px; letter-spacing: .06em; text-wrap: balance; }
#panel h2 { font: 700 26px/1.1 var(--display); color: var(--ember); margin: 0 0 8px; text-wrap: balance; }
#panel p { margin: 0 0 10px; line-height: 1.5; font-size: 14px; }
#panel .lede { font-size: 15px; }
#panel ul { margin: 0 0 12px; padding-left: 18px; font-size: 13.5px; line-height: 1.5; }
#panel .keys { color: var(--dim); font-size: 12.5px; }
#panel .stats { display: flex; gap: 22px; margin: 12px 0 14px; flex-wrap: wrap; }
#panel .stats div { display: grid; }
#panel .stats b { font: 700 28px var(--display); color: var(--ash); font-variant-numeric: tabular-nums; }
#panel .stats span { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
#panel button.go {
  font: 700 15px var(--ui); color: #1a1006; background: var(--ember); border: 0;
  padding: 10px 18px; border-radius: 2px; cursor: pointer; margin-top: 4px;
}
#panel .best { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
#panel .best a { color: var(--dim); }
#panel .pick { display: grid; gap: 8px; margin: 12px 0 4px; }
#panel .pick button {
  text-align: left; font: 400 13.5px/1.4 var(--ui); color: var(--ash); background: rgba(242,160,61,.08);
  border: 1px solid rgba(242,160,61,.45); padding: 10px 12px; border-radius: 2px; cursor: pointer;
}
#panel .pick button:hover { background: rgba(242,160,61,.2); }
#panel .pick b { display: block; font: 700 18px var(--display); color: var(--ember); }
#relics { color: var(--ember); font-size: 11px; letter-spacing: .04em; }
#frostRow.surge b { color: #fff; animation: pulse .5s infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
#banner { position: fixed; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; opacity: 0; padding: 0 16px; }
#banner b { display: block; font: 700 clamp(38px, 9vw, 80px)/1 var(--display); color: var(--ember); letter-spacing: .08em; text-shadow: 0 2px 18px #000, 0 0 3px #000; }
#banner span { font-size: 13px; color: var(--ash); letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
#banner.show { animation: banner 3.2s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.18); } 12% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; } }
@media (max-width: 620px) { #log { top: calc(env(safe-area-inset-top, 0px) + 178px); } #banner { top: 36%; } }
@media (pointer: coarse) { #rail kbd { display: none; } #rail button { padding: 10px 12px; } }
@media (max-height: 480px) { #hud { font-size: 12px; gap: 3px; } #dayLbl { font-size: 17px; } }
@keyframes bannerR { 0% { opacity: 0; } 12% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #banner.show { animation-name: bannerR; } #frostRow.surge b { animation: none; } }
</style>
</head>
<body>
<canvas id="game" aria-label="Game world"></canvas>

<div id="hud">
  <div class="row"><span id="dayLbl">Day 1</span><span id="sunTxt"></span></div>
  <div class="row"><span class="lbl" id="sunLbl">Daylight</span><div class="bar"><i id="sunFill"></i></div></div>
  <div class="row"><span class="lbl">Health</span><div class="bar"><i id="hpFill"></i></div></div>
  <div class="row"><span class="lbl">Food</span><div class="bar"><i id="foodFill"></i></div></div>
  <div class="inv"><span>Wood <b id="wood">0</b>/<span id="cap1">10</span></span><span>Berries <b id="ber">0</b>/<span id="cap2">10</span></span></div>
  <div class="row" id="frostRow">Frost <b id="frostTxt">0</b> paces west<span id="torchTxt"></span></div>
  <div id="relics"></div>
</div>
<div id="banner"><b id="banB"></b><span id="banS"></span></div>

<div id="log" aria-live="polite"></div>

<div id="rail">
  <button id="bGather"><kbd>Space</kbd>Gather</button>
  <button data-act="fire"><kbd>F</kbd>Fire / feed</button>
  <button data-act="eat"><kbd>E</kbd>Eat</button>
  <button data-act="torch"><kbd>T</kbd>Torch</button>
  <button data-act="wind"><kbd>B</kbd>Windbreak</button>
  <button data-act="throw"><kbd>Q</kbd>Throw brand</button>
</div>

<div id="panel"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#game'), cx = cv.getContext('2d');
const dark = document.createElement('canvas'), dx = dark.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  for (const c of [cv, dark]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  cx.setTransform(DPR, 0, 0, DPR, 0, 0); dx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// ---- Tuning -------------------------------------------------------------
const WORLD_H = 1300, CHUNK = 600, DAY_LEN = 80, PACE = 10, START_X = 240;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const has = k => !!S.relics[k];
const cap = () => has('sled') ? 15 : 10;
const nightLen = d => Math.min(40 + (d - 1) * 8, 88);            // nights grow longer
const frostSpeed = (d, night) => (night ? 1.5 : 8 + d * 1.4) * (S.surge > 0 ? 5 : 1); // px/s; the Frost mostly moves by day
const fireR = f => f.fuel > 0 ? (55 + Math.min(f.fuel, 110) * 1.15 + (f.wind ? 12 : 0)) * (S.gust > 0 && !f.wind ? .82 : 1) : 0;
const torchR = () => S.torch > 0 ? 40 + Math.min(S.torch, 35) * 1.6 + (has('lantern') ? 30 : 0) : 0;
const brandR = b => b.state === 'burn' && b.life > 0 ? 38 + 44 * Math.min(1, b.life / 2) : 0;
const RELICS = {
  hatchet: ['Hatchet', 'Chop wood twice as fast.'],
  sled: ['Sled', 'Carry 15 wood and 15 berries.'],
  flint: ['Flint', 'A new fire costs 1 wood and starts stronger.'],
  lantern: ['Lantern', 'Torches burn twice as long and shine wider.'],
  cloak: ['Fur cloak', 'The dark and the Frost chill you half as fast.'],
  boots: ['Waxed boots', 'Walk and run faster.'],
  sling: ['Sling', 'Brands fly farther and burst wider.'],
  pot: ['Stew pot', 'Berries fill you twice as much.'],
  bellows: ['Bellows', 'Each log you feed a fire burns half again as long.'],
  sieve: ['Ash sieve', 'Banished shades leave charcoal twice as often.']
};

// ---- Sound (all synthesized) --------------------------------------------
const A = { ctx: null, on: true, master: null, wind: null, noise: null };
try { A.on = localStorage.getItem('harsh.mute') !== '1'; } catch (e) {}
function audioInit() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const c = A.ctx = new AC();
  A.master = c.createGain(); A.master.gain.value = A.on ? .55 : 0; A.master.connect(c.destination);
  const n = c.sampleRate * 2, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  A.noise = buf;
  const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = .5;
  A.wind = c.createGain(); A.wind.gain.value = 0;
  src.connect(f); f.connect(A.wind); A.wind.connect(A.master); src.start();
}
function tone(f0, f1, dur, type = 'sine', vol = .2, delay = 0) {
  if (!A.ctx || !A.on) return; const c = A.ctx, t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t + dur + .03);
}
function hiss(dur, freq, vol, type = 'lowpass', delay = 0, f1 = freq) {
  if (!A.ctx || !A.on) return; const c = A.ctx, t = c.currentTime + delay;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = A.noise;
  f.type = type; f.frequency.setValueAtTime(freq, t); if (f1 !== freq) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(A.master); s.start(t, Math.random() * 1.5, dur + .05);
}
const SFX = {
  chop() { hiss(.06, 1400, .3); tone(150 + Math.random() * 30, 70, .09, 'triangle', .28); },
  wood() { tone(330, 495, .09, 'triangle', .16); },
  berry() { tone(620 + Math.random() * 80, 880, .06, 'sine', .14); },
  eat() { hiss(.05, 900, .18); hiss(.05, 700, .16, 'lowpass', .09); },
  ignite() { hiss(.5, 300, .3, 'bandpass', 0, 2400); tone(110, 220, .3, 'sawtooth', .06); },
  feed() { hiss(.25, 500, .22, 'bandpass', 0, 1800); },
  build() { for (let i = 0; i < 3; i++) { hiss(.05, 1000, .25, 'lowpass', i * .11); tone(120, 80, .07, 'triangle', .22, i * .11); } },
  thr() { hiss(.3, 600, .16, 'bandpass', 0, 2600); },
  burst() { hiss(.35, 2400, .4, 'lowpass', 0, 200); tone(90, 40, .3, 'sine', .35); },
  banish() { tone(520, 90, .35, 'sawtooth', .09); hiss(.3, 3000, .1, 'highpass'); },
  swat() { hiss(.05, 2500, .3, 'highpass'); tone(900, 300, .08, 'square', .06); },
  snuff() { hiss(.4, 1800, .3, 'lowpass', 0, 150); },
  hurt() { tone(160, 50, .4, 'sawtooth', .28); hiss(.2, 500, .3); },
  out() { hiss(.5, 1200, .14, 'lowpass', 0, 120); },
  warn() { tone(196, 196, .5, 'triangle', .14); tone(185, 185, .6, 'triangle', .14, .3); },
  surge() { hiss(1.6, 300, .4, 'bandpass', 0, 1600); },
  dusk() { tone(147, 147, 1.6, 'sine', .22); tone(220, 220, 1.6, 'sine', .1, .02); },
  night() { tone(98, 98, 2.2, 'sine', .26); tone(104, 104, 2.2, 'sine', .12); },
  dawn() { [262, 330, 392, 523].forEach((f, i) => tone(f, f, 1.1, 'triangle', .13, i * .14)); },
  relic() { [392, 494, 587, 784].forEach((f, i) => tone(f, f, .5, 'sine', .14, i * .09)); },
  bloom() { tone(660, 990, .25, 'sine', .14); tone(990, 1320, .3, 'sine', .08, .1); },
  die() { tone(110, 35, 1.8, 'sawtooth', .22); hiss(1.5, 400, .25, 'lowpass', 0, 80); }
};
const sfx = k => { if (A.ctx && A.on) SFX[k](); };
function ambience(dt) {
  if (!A.ctx) return;
  let v = .012;
  if (mode === 'play') {
    const fd = S.p.x - S.frostX;
    v = .02 + Math.max(0, 1 - fd / 700) * .12 + (S.night ? .025 : 0) + (S.gust > 0 ? .13 : 0) + (S.surge > 0 ? .16 : 0);
    const f = nearFire(260);
    if (f && Math.random() < dt * 9) hiss(.015 + Math.random() * .03, 1500 + Math.random() * 4000, .05 + Math.random() * .09, 'highpass');
  }
  A.wind.gain.setTargetAtTime(v, A.ctx.currentTime, .5);
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const groundPat = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#a3966a'; g.fillRect(0, 0, 256, 256);
  const r = rng(7);
  for (let i = 0; i < 900; i++) { g.fillStyle = r() < .5 ? 'rgba(80,70,40,.18)' : 'rgba(225,210,165,.16)'; g.fillRect(r() * 256, r() * 256, 1 + r() * 3, 1 + r() * 2); }
  g.strokeStyle = 'rgba(88,88,44,.45)'; g.lineWidth = 1;
  for (let i = 0; i < 70; i++) { const x = r() * 256, y = r() * 256; g.beginPath(); for (let k = 0; k < 4; k++) { g.moveTo(x + k * 2 - 3, y); g.lineTo(x + k * 2 - 3 + (r() - .5) * 4, y - 4 - r() * 5); } g.stroke(); }
  return cx.createPattern(c, 'repeat');
})();

// ---- State --------------------------------------------------------------
let S = null, mode = 'title';
const K = {}; let btnGather = false;
let best = 0, bestP = 0; try { best = +localStorage.getItem('harsh.best') || 0; bestP = +localStorage.getItem('harsh.bestPaces') || 0; } catch (e) {}

function newGame() {
  S = {
    seed: (Math.random() * 1e9) | 0, day: 1, t: 0, night: false, time: 0,
    p: { x: START_X, y: WORLD_H / 2, hp: 100, food: 85, wood: 1, berries: 2, face: 1, walk: 0, swingT: -9 },
    frostX: -380, fires: [], shades: [], objs: [], nextChunk: -1, torch: 0,
    gather: { obj: null, prog: 0, ch: 0 }, near: null, target: null, autoObj: null, runTo: false,
    relics: {}, brands: [], drops: [], floats: [], throwCd: 0, gust: 0, gustT: 0, surge: 0, surgeAt: 0, surged: true,
    mothT: 0, hollowT: 0, camX: 0, camY: 0, seen: {},
    spawnT: 4, flags: {}, stats: { fires: 0, maxX: START_X, kills: 0 }, shake: 0, hurt: 0, parts: [], cause: '', cullT: 0
  };
  genAhead(); camUpdate(0, true);
}

function camUpdate(dt, snap) {
  const p = S.p, x = p.x - W * .44; let y = p.y - H / 2;
  y = H < WORLD_H + 80 ? Math.max(-40, Math.min(WORLD_H + 40 - H, y)) : (WORLD_H - H) / 2;
  const k = snap ? 1 : 1 - Math.exp(-dt * 7);
  S.camX += (x - S.camX) * k; S.camY += (y - S.camY) * k;
}

function genChunk(i) {
  const r = rng(S.seed ^ Math.imul(i + 1000, 2654435761));
  const x0 = i * CHUNK;
  const dens = Math.max(.4, 1 - Math.max(0, i) * .03);           // the land thins out eastward
  const barren = i > 2 && r() < .18;
  const groves = 1 + Math.floor(r() * 3), centers = [];
  for (let g = 0; g < groves; g++) centers.push([x0 + 60 + r() * (CHUNK - 120), 140 + r() * (WORLD_H - 280)]);
  const nT = Math.round((7 + r() * 7) * dens * (barren ? .25 : 1));
  for (let n = 0; n < nT; n++) {
    const c = centers[n % groves], a = r() * 6.283, d = r() * 170, w = 2 + Math.floor(r() * 3);
    S.objs.push({ type: 'tree', x: c[0] + Math.cos(a) * d, y: Math.max(30, Math.min(WORLD_H - 30, c[1] + Math.sin(a) * d)), r: 16 + r() * 8, stock: w, max: w, seed: r() });
  }
  const nB = Math.round((4 + r() * 5) * dens * (barren ? .3 : 1));
  for (let n = 0; n < nB; n++) { const s = 2 + Math.floor(r() * 3); S.objs.push({ type: 'bush', x: x0 + r() * CHUNK, y: 40 + r() * (WORLD_H - 80), r: 11, stock: s, max: s, seed: r() }); }
  if (i > 0 && r() < .16) S.objs.push({ type: 'cache', x: x0 + 80 + r() * (CHUNK - 160), y: 100 + r() * (WORLD_H - 200), r: 15, stock: 1, max: 1, seed: r() });
  if (i >= 2 && i % 4 === 2) S.objs.push({ type: 'ruin', x: x0 + 120 + r() * (CHUNK - 240), y: 160 + r() * (WORLD_H - 320), r: 20, stock: 1, max: 1, seed: r() });
  const nR = Math.floor(r() * 5);
  for (let n = 0; n < nR; n++) S.objs.push({ type: 'rock', x: x0 + r() * CHUNK, y: r() * WORLD_H, r: 6 + r() * 12, stock: 0, seed: r() });
}
function genAhead() { while (S.nextChunk * CHUNK < S.p.x + W + CHUNK) genChunk(S.nextChunk++); }

function say(text) {
  const d = document.createElement('div'); d.textContent = text;
  const log = $('#log'); log.appendChild(d);
  while (log.children.length > 3) log.firstChild.remove();
  setTimeout(() => d.remove(), 6000);
}
function once(key, text) { if (!S.seen[key]) { S.seen[key] = 1; say(text); return true; } }      // once per run
function daily(key, text) { if (!S.flags[key]) { S.flags[key] = 1; say(text); return true; } }    // once per day
function banner(big, small) {
  const b = el('banner'); el('banB').textContent = big; el('banS').textContent = small || '';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
function float(x, y, text, col = '#e9e1cf') { S.floats.push({ x, y, text, col, life: 1.2 }); }

function darkA() {
  if (!S.night) { const k = S.t - (DAY_LEN - 14); return k > 0 ? .4 * k / 14 : 0; }
  const L = nightLen(S.day);
  if (S.t < 8) return .4 + .54 * S.t / 8;
  if (S.t > L - 7) return Math.max(0, .94 * (L - S.t) / 7);
  return .94;
}
function inLight(x, y, mult = .82) {

// ---- Update -------------------------------------------------------------
function update(dt) {

    if (S.day === 1 && S.t > 2) once('h1', 'Hold Space beside a tree to chop wood.');
    if (S.day === 1 && S.t > 20) once('h2', 'Keep moving east. The Frost takes everything behind you.');
    if (S.day === 1 && S.t > 36) once('h3', 'Hold Shift to run. Running makes you hungry.');
    if (!S.surged) {
      if (S.t > S.surgeAt - 4 && daily('surgeW', 'The wind turns. The Frost is about to surge.')) sfx('warn');
      if (S.t > S.surgeAt) { S.surged = true; S.surge = 5; say('The Frost surges!'); sfx('surge'); }
    }
    if (S.t > DAY_LEN - 25) daily('low', 'The sun is getting low.');
    if (S.t > DAY_LEN - 10 && daily('dusk', nearFire() ? 'Dusk. Feed the fire.' : 'Dusk. Make a fire now. [F]')) sfx('dusk');

      S.night = true; S.t = 0; S.spawnT = 3; S.mothT = 7; S.hollowT = 9 + Math.random() * 8; S.gustT = 12 + Math.random() * 12; S.surge = 0;

        const a = Math.random() * 6.283, d = 240 + Math.random() * 220, x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d;
        if (x < S.frostX + 160 || y < 30 || y > WORLD_H - 30) continue;

    S.shades = []; S.drops = S.drops.filter(d => d.kind !== 'bloom');
    S.surgeAt = 16 + Math.random() * 40; S.surged = false;

  }

    if (run) { p.food = Math.max(0, p.food - dt * 2); if (Math.random() < dt * 14) S.parts.push({ x: p.x, y: p.y + 8, vx: -mx * 20, vy: -6, life: .4, col: 'rgba(200,185,140,.7)', s: 2.5 }); }

    else {
      S.gather.prog += dt / ({ tree: has('hatchet') ? .42 : .84, bush: .4, cache: 1.2, ruin: 1.2 })[g.type];
      if (g.type === 'tree') { // three swings per log
        const ch = Math.min(3, Math.floor(S.gather.prog * 3 + .5));
        if (ch > S.gather.ch) { S.gather.ch = ch; g.shakeT = S.time; p.swingT = S.time; p.face = g.x >= p.x ? 1 : -1; sfx('chop'); puff(g.x, g.y - 4, '#c9a878', 3, 60); }

      if (d.kind === 'bloom') { p.hp = Math.min(100, p.hp + 18); p.food = Math.min(100, p.food + 10); float(d.x, d.y - 14, 'Moonbloom  +health', '#bfe9ff'); puff(d.x, d.y, '#bfe9ff', 12, 50); sfx('bloom'); d.life = 0; }
      else if (p.wood < cap()) { p.wood++; float(d.x, d.y - 14, '+1 wood', '#d9b27a'); sfx('wood'); d.life = 0; }

  }
  S.drops = S.drops.filter(d => d.life > 0);
  for (const q of S.floats) { q.y -= dt * 22; q.life -= dt; }
  S.floats = S.floats.filter(q => q.life > 0);

  }

  // body

// ---- Render -------------------------------------------------------------
function drawTree(o) {

  const sh = S.time - (o.shakeT ?? -9), ox = sh < .22 && !RM ? Math.sin(sh * 70) * 3.5 * (1 - sh / .22) : 0;

}

}
function drawBush(o) {
  cx.fillStyle = 'rgba(30,24,10,.25)'; cx.beginPath(); cx.ellipse(o.x + 4, o.y + 5, 13, 6, 0, 0, 6.283); cx.fill();
  cx.fillStyle = o.stock > 0 ? '#4d5b30' : '#6b6a46';
  for (let i = 0; i < 3; i++) { cx.beginPath(); cx.arc(o.x + (i - 1) * 6, o.y - Math.abs(i - 1) * -3, 8, 0, 6.283); cx.fill(); }
  cx.fillStyle = '#c4453a';
  for (let i = 0; i < o.stock; i++) { const a = o.seed * 9 + i * 2.4; cx.beginPath(); cx.arc(o.x + Math.cos(a) * 7, o.y + Math.sin(a) * 4 - 2, 2.2, 0, 6.283); cx.fill(); }
}
function drawCache(o) {
  cx.fillStyle = '#7d7666';
  for (let i = 0; i < 7; i++) { const a = i / 7 * 6.283; cx.beginPath(); cx.arc(o.x + Math.cos(a) * 17, o.y + Math.sin(a) * 11, 3.5, 0, 6.283); cx.fill(); }
  cx.fillStyle = o.stock > 0 ? '#6b4a2b' : '#3d2a19'; cx.fillRect(o.x - 7, o.y - 6, 14, 10);

}
function drawRuin(o) {
  const open = o.stock > 0;
  cx.fillStyle = 'rgba(30,24,10,.28)'; cx.beginPath(); cx.ellipse(o.x + 5, o.y + 10, 34, 14, 0, 0, 6.283); cx.fill();
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * 6.283 + .4, x = o.x + Math.cos(a) * 28, y = o.y + Math.sin(a) * 15, h = 16 + ((o.seed * 97 * (i + 1)) % 10);

  }
  cx.fillStyle = open ? '#e8c46a' : '#5a5344'; cx.beginPath(); cx.moveTo(o.x, o.y - 12); cx.lineTo(o.x + 7, o.y - 2); cx.lineTo(o.x, o.y + 6); cx.lineTo(o.x - 7, o.y - 2); cx.closePath(); cx.fill();

}
function drawRock(o) {

}

  cx.fillStyle = '#6e221d'; cx.beginPath(); cx.ellipse(p.x - p.face * 3, p.y, 5, 7, 0, 0, 6.283); cx.fill();

function render() {
  const p = S.p;
  let camX = S.camX, camY = S.camY;
  if (S.shake > 0) { camX += (Math.random() - .5) * 14 * S.shake; camY += (Math.random() - .5) * 14 * S.shake; }

  cx.save(); cx.translate(-camX, -camY);
  cx.fillStyle = '#2b2519'; cx.fillRect(camX, camY, W, H);
  const y0 = Math.max(camY, 0), y1 = Math.min(camY + H, WORLD_H);
  cx.fillStyle = groundPat; cx.fillRect(camX, y0, W, y1 - y0);

    else if (o.type === 'cache') drawCache(o); else if (o.type === 'rock') drawRock(o); else if (o.type === 'ruin') drawRuin(o);
    else if (o.type === 'fire') drawFire(o.f); else drawPlayer(p);

    cx.fillStyle = 'rgba(11,13,22,.7)'; cx.fillRect(S.near.x - 20, S.near.y - S.near.r - 26, 40, 14);
    cx.fillStyle = '#f2a03d'; cx.fillText('SPACE', S.near.x, S.near.y - S.near.r - 16);
  }
  if (S.gather.obj && S.gather.prog > 0) {
    cx.strokeStyle = 'rgba(11,13,22,.6)'; cx.lineWidth = 4; cx.beginPath(); cx.arc(p.x, p.y - 2, 16, 0, 6.283); cx.stroke();
    cx.strokeStyle = '#f2a03d'; cx.lineWidth = 3; cx.beginPath(); cx.arc(p.x, p.y - 2, 16, -1.571, -1.571 + 6.283 * S.gather.prog); cx.stroke();
  }

    cx.lineTo(camX - 20, camY + H + 24); cx.closePath();
    cx.fillStyle = 'rgba(214,234,244,.9)'; cx.fill();
    const g = cx.createLinearGradient(S.frostX, 0, S.frostX + 170, 0);
    g.addColorStop(0, 'rgba(200,228,242,.5)'); g.addColorStop(1, 'rgba(200,228,242,0)');
    cx.fillStyle = g; cx.fillRect(S.frostX, camY, 170, H);
  }
  cx.restore();

  // darkness with light cut out
  const a = darkA();
  const lights = [];
  for (const f of S.fires) { const r = fireR(f); if (r) lights.push({ x: f.x, y: f.y, r: r * (1 + Math.sin(S.time * (S.gust > 0 && !f.wind ? 23 : 9) + f.seed) * (S.gust > 0 && !f.wind ? .07 : .025)), s: 1 }); }

    dx.globalCompositeOperation = 'destination-out';

      const sx = L.x - camX, sy = L.y - camY, g = cx.createRadialGradient(sx, sy, 0, sx, sy, L.r);
      g.addColorStop(0, `rgba(255,140,40,${.22 * a})`); g.addColorStop(1, 'rgba(255,140,40,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(sx, sy, L.r, 0, 6.283); cx.fill();
    }

  }

    const top = Math.floor(camY / 12) * 12 - 12;

    cx.stroke();
  }
  for (const d of S.drops) {
    if (d.kind === 'bloom') {
      const g = cx.createRadialGradient(d.x, d.y, 0, d.x, d.y, 26); g.addColorStop(0, `rgba(170,225,255,${.4 + Math.sin(S.time * 2 + d.x) * .12})`); g.addColorStop(1, 'rgba(170,225,255,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(d.x, d.y, 26, 0, 6.283); cx.fill();
      cx.fillStyle = '#dff4ff'; for (let i = 0; i < 5; i++) { const an = i / 5 * 6.283 + S.time * .3; cx.beginPath(); cx.ellipse(d.x + Math.cos(an) * 4, d.y + Math.sin(an) * 4, 3.2, 2, an, 0, 6.283); cx.fill(); }

    else { const k = Math.min(1, b.life / 2), fl = Math.sin(S.time * 15 + b.x); cx.fillStyle = '#e0581f'; cx.beginPath(); cx.ellipse(b.x, b.y - 4 * k, 4.5 * k + 1, (8 + fl) * k + 1, 0, 0, 6.283); cx.fill(); cx.fillStyle = '#ffcf70'; cx.beginPath(); cx.ellipse(b.x, b.y - 2 * k, 2.2 * k, 4 * k, 0, 0, 6.283); cx.fill(); }
  }
  for (const s of S.shades) {
    const al = Math.max(0, Math.min(1, s.life));
    if (s.kind === 'moth') {
      const fl = Math.sin(s.wob * 30) * 5;
      cx.fillStyle = 'rgba(190,227,245,.85)';
      cx.beginPath(); cx.ellipse(s.x - 5, s.y, 6, 2 + Math.abs(fl), -.5, 0, 6.283); cx.fill();
      cx.beginPath(); cx.ellipse(s.x + 5, s.y, 6, 2 + Math.abs(fl), .5, 0, 6.283); cx.fill();
      cx.fillStyle = '#f4fbff'; cx.beginPath(); cx.ellipse(s.x, s.y, 2, 4.5, 0, 0, 6.283); cx.fill();
      continue;
    }
    if (s.kind === 'hollow') {
      cx.fillStyle = s.flash > 0 ? `rgba(255,190,110,${.8 * al})` : `rgba(10,7,20,${.55 + .35 * al})`;
      for (let i = 0; i < 4; i++) { cx.beginPath(); cx.arc(s.x + Math.sin(s.wob * 2 + i) * 6, s.y + Math.cos(s.wob * 1.6 + i * 2) * 5 - i * 7, 20 - i * 3.5, 0, 6.283); cx.fill(); }
      cx.fillStyle = `rgba(255,120,70,${.5 + .5 * al})`;
      cx.fillRect(s.x - 9, s.y - 16, 6, 3); cx.fillRect(s.x + 3, s.y - 16, 6, 3);
      cx.fillStyle = 'rgba(11,13,22,.7)'; cx.fillRect(s.x - 14, s.y - 44, 28, 4); cx.fillStyle = '#ff7846'; cx.fillRect(s.x - 14, s.y - 44, 28 * al, 4);

    for (let i = 0; i < 3; i++) { cx.beginPath(); cx.arc(s.x + Math.sin(s.wob * 3 + i) * 4, s.y + Math.cos(s.wob * 2 + i * 2) * 4 - i * 4, 11 - i * 2.5, 0, 6.283); cx.fill(); }

  // pointers to burning fires that are off-screen

    if (sx > 0 && sx < W && sy > 0 && sy < H) continue;
    const ex = Math.max(14, Math.min(W - 14, sx)), ey = Math.max(70, Math.min(H - 54, sy)), ang = Math.atan2(sy - ey, sx - ex);

    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }
  if (S.hurt > 0 || p.hp < 30) {
    const k = Math.max(S.hurt * .5, p.hp < 30 ? (30 - p.hp) / 30 * .35 * (.8 + Math.sin(S.time * 5) * .2) : 0);
    const g = cx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7);

  }
}

// ---- HUD ----------------------------------------------------------------
const el = id => document.getElementById(id);
const hudEl = { cap1: el('cap1'), cap2: el('cap2'), relics: el('relics'), day: el('dayLbl'), sunTxt: el('sunTxt'), sunLbl: el('sunLbl'), sun: el('sunFill'), hp: el('hpFill'), food: el('foodFill'), wood: el('wood'), ber: el('ber'), frost: el('frostTxt'), frostRow: el('frostRow'), torch: el('torchTxt') };
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function hud() {
  const p = S.p;
  hudEl.day.textContent = (S.night ? 'Night ' : 'Day ') + S.day;
  if (S.night) {
    const L = nightLen(S.day);
    hudEl.sunLbl.textContent = 'Night'; hudEl.sunTxt.textContent = 'dawn in ' + mmss(L - S.t);
    hudEl.sun.style.width = (S.t / L * 100) + '%'; hudEl.sun.style.background = '#6f7fa8';
  } else {
    hudEl.sunLbl.textContent = 'Daylight'; hudEl.sunTxt.textContent = 'dusk in ' + mmss(DAY_LEN - S.t);
    hudEl.sun.style.width = ((1 - S.t / DAY_LEN) * 100) + '%';
    hudEl.sun.style.background = S.t > DAY_LEN - 25 ? '#e0703a' : '#e8c46a';
  }
  hudEl.hp.style.width = Math.max(0, p.hp) + '%';
  hudEl.food.style.width = p.food + '%';
  hudEl.wood.textContent = p.wood; hudEl.ber.textContent = p.berries;
  hudEl.cap1.textContent = hudEl.cap2.textContent = cap();
  const rl = Object.keys(S.relics).map(k => RELICS[k][0]).join(' · '); if (hudEl.relics.textContent !== rl) hudEl.relics.textContent = rl;
  hudEl.frostRow.classList.toggle('surge', S.surge > 0);
  const fd = Math.max(0, Math.round((p.x - S.frostX) / PACE));
  hudEl.frost.textContent = fd; hudEl.frostRow.classList.toggle('near', fd < 30);
  hudEl.torch.textContent = S.torch > 0 ? ' · torch ' + Math.ceil(S.torch) + 's' : '';
}

// ---- Screens ------------------------------------------------------------
const panel = el('panel'), card = el('card');
const CAUSES = { shade: 'Something in the dark reached you.', cold: 'The cold took you in the dark.', hunger: 'You starved.', frost: 'The Frost caught you.' };
function showTitle() {
  card.innerHTML = `
    <h1>Harsh</h1>
    <p class="lede">The Frost is coming from the west, and it does not stop. Every dusk you need a fire. Every dawn you have to leave it behind.</p>
    <ul>
      <li><b>Daylight</b> is for walking east and gathering wood and berries.</li>
      <li><b>Night</b> is cold, and things in the dark come for you. Light holds them back. A thrown brand banishes them.</li>
      <li><b>Wood is everything:</b> fuel, torch and weapon. You carry 10. Nothing regrows.</li>
      <li><b>Ruins</b> hold relics that change your run. Follow the gold marker.</li>
    </ul>
    <p class="keys">Move with WASD or arrows, or click where to walk. Hold <kbd>Shift</kbd> or double-click to run. Hold <kbd>Space</kbd> or click a tree or bush to gather. <kbd>F</kbd> fire or feed · <kbd>E</kbd> eat · <kbd>T</kbd> torch · <kbd>B</kbd> windbreak · <kbd>Q</kbd> or right-click throw brand · <kbd>P</kbd> pause · <kbd>M</kbd> sound</p>
    <button class="go" id="go">Walk into day 1</button>
    ${best ? `<p class="best">Longest so far: ${best} ${best === 1 ? 'day' : 'days'}${bestP ? ', ' + bestP.toLocaleString() + ' paces east' : ''}</p>` : ''}
    <p class="best"><a href="https://stilotto.github.io/">More games from Stilotto</a></p>`;
  panel.hidden = false; el('go').onclick = start; el('go').focus();
}
function die() {
  mode = 'over'; sfx('die');
  const days = S.day, paces = Math.max(0, Math.round((S.stats.maxX - START_X) / PACE));
  const newBest = days > best; if (newBest) { best = days; try { localStorage.setItem('harsh.best', best); } catch (e) {} }
  const farther = paces > bestP; if (farther) { bestP = paces; try { localStorage.setItem('harsh.bestPaces', bestP); } catch (e) {} }
  const rl = Object.keys(S.relics).map(k => RELICS[k][0]).join(', ');
  card.innerHTML = `
    <h2>${S.night ? 'Night' : 'Day'} ${days}. ${CAUSES[S.cause] || 'You fell.'}</h2>
    <div class="stats">
      <div><b>${days}</b><span>${days === 1 ? 'day' : 'days'}</span></div>
      <div><b>${paces.toLocaleString()}</b><span>paces east</span></div>
      <div><b>${S.stats.fires}</b><span>fires lit</span></div>
      <div><b>${S.stats.kills}</b><span>banished</span></div>
    </div>
    ${rl ? `<p class="best">Carried: ${rl}</p>` : ''}
    <p class="best">${newBest ? 'Your longest run yet.' : farther ? 'Your farthest walk yet.' : 'Longest so far: ' + best + ' days, ' + bestP.toLocaleString() + ' paces'}</p>
    <button class="go" id="go">Try again</button>`;
  panel.hidden = false; el('go').onclick = start; el('go').focus();
}
function showRelics(opts) {
  mode = 'relic'; sfx('relic'); for (const k in K) K[k] = false;
  card.innerHTML = `<h2>A ruin, still standing</h2><p>Someone walked east before you. Take one thing. The Frost gets the rest.</p>
    <div class="pick">${opts.map((k, i) => `<button data-k="${k}"><b>${i + 1}. ${RELICS[k][0]}</b>${RELICS[k][1]}</button>`).join('')}</div>`;
  panel.hidden = false;
  const btns = card.querySelectorAll('.pick button');
  for (const b of btns) b.onclick = () => pickRelic(b.dataset.k);
  btns[0].focus();
}
function pickRelic(k) {
  if (mode !== 'relic') return;
  S.relics[k] = 1; mode = 'play'; panel.hidden = true;
  say(RELICS[k][0] + '. ' + RELICS[k][1]); float(S.p.x, S.p.y - 30, RELICS[k][0], '#e8c46a');
}
function pause(on) {
  if (on && mode === 'play') {
    mode = 'pause'; card.innerHTML = `<h2>Paused</h2><p>The Frost waits with you.</p><button class="go" id="go">Resume</button>`;
    panel.hidden = false; el('go').onclick = () => pause(false); el('go').focus();
  } else if (!on && mode === 'pause') { mode = 'play'; panel.hidden = true; cv.focus(); }
}
function start() {
  if (document.activeElement) document.activeElement.blur();
  audioInit();
  newGame(); mode = 'play'; panel.hidden = true;
  $('#log').innerHTML = ''; say('Day 1. The Frost is somewhere behind you, to the west.'); banner('Day 1', 'Walk east');
  for (const k in K) K[k] = false;
}

// ---- Input --------------------------------------------------------------
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'gather', ShiftLeft: 'run', ShiftRight: 'run' };
addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { if (mode === 'play') { K[KEYMAP[e.code]] = true; e.preventDefault(); } }
  if (e.repeat) return;
  if (e.code === 'KeyM') {
    A.on = !A.on; try { localStorage.setItem('harsh.mute', A.on ? '0' : '1'); } catch (er) {}
    if (A.on) audioInit(); if (A.master) A.master.gain.value = A.on ? .55 : 0;
    if (mode === 'play') say(A.on ? 'Sound on.' : 'Sound off.');
  }
  if (mode === 'relic') { const b = card.querySelectorAll('.pick button')[{ Digit1: 0, Digit2: 1, Numpad1: 0, Numpad2: 1 }[e.code]]; if (b) b.click(); return; }
  if (mode === 'play') {
    const a = { KeyF: 'fire', KeyE: 'eat', KeyT: 'torch', KeyB: 'wind', KeyQ: 'throw' }[e.code];
    if (a) act(a);
    if (e.code === 'KeyP' || e.code === 'Escape') pause(true);
  } else if (mode === 'pause' && (e.code === 'KeyP' || e.code === 'Escape')) pause(false);
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) K[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { for (const k in K) K[k] = false; btnGather = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

cv.addEventListener('pointerdown', e => {
  if (mode !== 'play') return;
  const wx = e.clientX + S.camX, wy = e.clientY + S.camY;
  if (e.button === 2) return throwBrand(wx, wy);
  const now = performance.now(); S.runTo = now - lastTap < 330; lastTap = now;
  let hit = null;
  for (const o of S.objs) if (o.stock > 0 && o.type !== 'rock' && o.x > S.frostX && Math.hypot(o.x - wx, o.y - wy) < o.r + 12) { hit = o; break; }
  S.autoObj = hit; S.target = hit ? { x: hit.x, y: hit.y } : { x: wx, y: wy };
});
let lastTap = 0;
cv.addEventListener('contextmenu', e => e.preventDefault());
const bG = el('bGather');
const gOn = e => { e.preventDefault(); btnGather = true; bG.classList.add('on'); };
const gOff = () => { btnGather = false; bG.classList.remove('on'); };
bG.addEventListener('pointerdown', gOn);
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) bG.addEventListener(ev, gOff);
for (const b of document.querySelectorAll('#rail [data-act]')) b.addEventListener('click', () => { act(b.dataset.act); b.blur(); });

// ---- Loop ---------------------------------------------------------------
newGame(); S.t = DAY_LEN - 6; S.p.x = 700; S.frostX = 380; genAhead(); camUpdate(0, true); // a dusk scene behind the title
showTitle();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'play') update(dt); else if (mode === 'title') S.time += dt;
  camUpdate(dt, mode === 'title'); ambience(dt);
  render(); hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
